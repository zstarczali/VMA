# The `vma` command-line compiler for every platform: Windows x64 / ARM64, macOS x64 / ARM64, Linux x64,
# each package with README, LICENSE and every PDF (README.pdf, docs/*.pdf).
# Manual only (Actions → Release → Run workflow): the packages are workflow artifacts; with "publish"
# they also become a GitHub release tagged v<Cargo.toml version> at the commit the run was started on.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (tag v<version>)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest,  target: x86_64-pc-windows-msvc,    exe: vma.exe }
          - { name: windows-arm64, os: windows-11-arm,  target: aarch64-pc-windows-msvc,   exe: vma.exe }
          - { name: macos-x64,     os: macos-latest,    target: x86_64-apple-darwin,       exe: vma }
          - { name: macos-arm64,   os: macos-latest,    target: aarch64-apple-darwin,      exe: vma }
          - { name: linux-x64,     os: ubuntu-latest,   target: x86_64-unknown-linux-gnu,  exe: vma }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $dir = "vma-$version-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.exe }}", README.md, LICENSE, README.pdf $dir
          New-Item -ItemType Directory "$dir/docs" | Out-Null
          $pdfs = Get-ChildItem docs/*.pdf
          if (-not $pdfs) { throw "no PDF in docs/" }
          Copy-Item $pdfs "$dir/docs"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "ASSET=$dir.zip" >> $env:GITHUB_ENV
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          dir="vma-$version-${{ matrix.name }}"
          mkdir -p "$dir/docs"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE README.pdf "$dir/"
          cp docs/*.pdf "$dir/docs/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
      - name: Smoke test
        if: matrix.name != 'macos-x64'
        shell: bash
        run: |
          printf '* = $1000\n    lda #$01\n    rts\n' > smoke.asm
          "target/${{ matrix.target }}/release/${{ matrix.exe }}" build smoke.asm --no-basic-stub -o smoke.prg
          test "$(od -An -tx1 smoke.prg | tr -d ' \n')" = "0010a90160"
      - uses: actions/upload-artifact@v4
        with:
          name: vma-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: VMA ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
